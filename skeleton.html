<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#303446" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)">
  {{if description}}<meta name="description" content="{{description}}">{{end}}
  {{if noindex}}<meta name="robots" content="noindex">{{else}}<link rel="canonical" href="{{canonical_url}}">{{end}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Harshit Joshi">
  <meta property="og:title" content="{{og_title}}">
  {{if og_description}}<meta property="og:description" content="{{og_description}}">{{end}}
  {{if absolute_url}}<meta property="og:url" content="{{absolute_url}}">{{end}}
  <title></title>
  <style>{{inline "style.css"}}</style>
  <link rel="icon" type="image/svg+xml" href="{{asset "assets/logo.svg"}}">
  <script type="speculationrules">
  {"prefetch":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/cdn-cgi/*"}}]},"eagerness":"moderate"}]}
  </script>
</head>
<body>
<nav aria-label="Site">
  <a href="/">home</a> · <a href="/projects/">projects</a> · <a href="/#contact">contact</a>
</nav>
<main>
</main>
</body>
</html>
