name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Checkout content repository
      # ─────────────────────────────────────────────

      - name: Checkout content
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Checkout builder
      # ─────────────────────────────────────────────

      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          repository: isworking/ssg
          path: builder

      # ─────────────────────────────────────────────
      # Build builder
      # ─────────────────────────────────────────────

      - name: Build ssg
        run: |
          cmake -S builder -B builder/build -DCMAKE_BUILD_TYPE=Release
          cmake --build builder/build --config Release

      # ─────────────────────────────────────────────
      # Inline CSS (removes the only render-blocking request)
      # ─────────────────────────────────────────────

      - name: Inline CSS
        run: |
          npx --yes lightningcss-cli@1.33.0 --minify style.css -o "$RUNNER_TEMP/style.min.css"
          node -e '
            const fs = require("fs");
            const css = fs.readFileSync(process.argv[1], "utf8").trim().replace(/<\/style/gi, "<\\/style");
            const link = "<link rel=\"stylesheet\" href=\"/style.css\">";
            const html = fs.readFileSync("skeleton.html", "utf8");
            if (!html.includes(link)) throw new Error("stylesheet link not found in skeleton.html");
            fs.writeFileSync("skeleton.html", html.replace(link, () => `<style>${css}</style>`));
          ' "$RUNNER_TEMP/style.min.css"

      # ─────────────────────────────────────────────
      # Generate dist/
      # ─────────────────────────────────────────────

      - name: Generate site
        run: |
          ./builder/build/ssg .

      - name: Verify dist
        run: |
          test -d dist
          test -n "$(find dist -type f -print -quit)"

      # ─────────────────────────────────────────────
      # Create release version
      # ─────────────────────────────────────────────

      - name: Generate version
        id: version
        run: |
          VERSION="$(date -u '+%Y.%m.%d.%H%M%S')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Site version: $VERSION"

      # ─────────────────────────────────────────────
      # Archive generated site
      # ─────────────────────────────────────────────

      - name: Archive dist
        run: |
          tar -czf "dist-${{ steps.version.outputs.version }}.tar.gz" dist

      # ─────────────────────────────────────────────
      # Create GitHub release
      # ─────────────────────────────────────────────

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "site-${{ steps.version.outputs.version }}" \
            "dist-${{ steps.version.outputs.version }}.tar.gz" \
            --title "Site ${{ steps.version.outputs.version }}" \
            --generate-notes

      # ─────────────────────────────────────────────
      # Deploy to Cloudflare Workers
      # ─────────────────────────────────────────────

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
